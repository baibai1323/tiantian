name: Build Desktop App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  test:
    # 先跑前后端测试：测试不过就不该产出安装包。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements-test.txt

      - name: Run backend tests
        run: python -m pytest backend/tests -q

      - name: Install frontend deps
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

  build:
    needs: test
    # 普通提交只跑测试，避免每次 push 都产三个安装包；打 tag 或手动触发才打包。
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TianTian-Windows
          - os: macos-15
            artifact: TianTian-macOS-AppleSilicon
          - os: macos-15-intel    # Intel 芯片
            artifact: TianTian-macOS-Intel

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --windowed --name TianTianJiZhang --onedir `
            --add-data "frontend/dist;frontend/dist" `
            --paths backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --collect-submodules webview `
            run.py
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <runtime>
              <loadFromRemoteSources enabled="true" />
            </runtime>
          </configuration>
          '@ | Set-Content dist/TianTianJiZhang/TianTianJiZhang.exe.config -Encoding UTF8

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name TianTianJiZhang \
            --osx-bundle-identifier com.tiantian.jizhang \
            --add-data "frontend/dist:frontend/dist" \
            --paths backend \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --collect-submodules webview \
            run.py

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/TianTianJiZhang/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # ditto 会保留 .app 内部的符号链接与权限，比 zip -r 更可靠
          ditto -c -k --keepParent TianTianJiZhang.app "../${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: "*.zip"
          if-no-files-found: error
