name: Build Desktop App

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TianTian-Windows
          - os: macos-14          # Apple 芯片（M1/M2/M3/M4）
            artifact: TianTian-macOS-AppleSilicon
          - os: macos-15-intel    # Intel 芯片
            artifact: TianTian-macOS-Intel

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pyinstaller

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --windowed --name TianTianJiZhang --onedir `
            --add-data "frontend/dist;frontend/dist" `
            --paths backend `
            --hidden-import uvicorn.logging `
            --hidden-import uvicorn.loops.auto `
            --hidden-import uvicorn.protocols.http.auto `
            --hidden-import uvicorn.protocols.websockets.auto `
            --hidden-import uvicorn.lifespan.on `
            --collect-submodules webview `
            run.py
          @'
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <runtime>
              <loadFromRemoteSources enabled="true" />
            </runtime>
          </configuration>
          '@ | Set-Content dist/TianTianJiZhang/TianTianJiZhang.exe.config -Encoding UTF8

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name TianTianJiZhang \
            --osx-bundle-identifier com.tiantian.jizhang \
            --add-data "frontend/dist:frontend/dist" \
            --paths backend \
            --hidden-import uvicorn.logging \
            --hidden-import uvicorn.loops.auto \
            --hidden-import uvicorn.protocols.http.auto \
            --hidden-import uvicorn.protocols.websockets.auto \
            --hidden-import uvicorn.lifespan.on \
            --collect-submodules webview \
            run.py

      - name: Zip (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/TianTianJiZhang/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Zip (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          # ditto 会保留 .app 内部的符号链接与权限，比 zip -r 更可靠
          ditto -c -k --keepParent TianTianJiZhang.app "../${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: "*.zip"
          if-no-files-found: error
